<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Replay recorded runs of agent-village, a small village of LLM agents working on one goal." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Village Replay</title>
    <script>
      try {
        var stored = localStorage.getItem('village-replay-theme')
        if (stored === 'light' || stored === 'dark') document.documentElement.dataset.theme = stored
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
